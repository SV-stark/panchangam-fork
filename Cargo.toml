[package]
name = "panchangam"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.105"
js-sys = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
spa = "0.5.1"
libc = "0.2"
libm = "0.2.15"


[build-dependencies]
cc = "1.0"
bindgen = "0.69"
