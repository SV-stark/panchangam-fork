name: CI/CD

on:
  push:
    branches: ["creation"]
  pull_request:
    branches: ["creation"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # For JSR publishing

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build Wasm
        run: deno task build

      - name: Integration Tests
        run: deno test -A tests/core.test.ts

      - name: Build Swisseph Wasm (Standalone)
        run: |
          cd swisseph-wasm
          deno task build

  publish-crates:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Publish swisseph-wasm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cd swisseph-wasm
            cargo publish --allow-dirty || echo "Generic publish failure"
          else
            echo "Skipping crates.io publish (no token)"
          fi

      - name: Publish panchangam
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish --allow-dirty || echo "Generic publish failure"
          else
            echo "Skipping crates.io publish (no token)"
          fi

  publish-jsr:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
          
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Publish swisseph-wasm to JSR
        run: |
          cd swisseph-wasm
          deno task build
          npx jsr publish --allow-dirty || echo "JSR publish skipped/failed"

      - name: Publish panchangam to JSR
        run: |
          deno task build
          npx jsr publish --allow-dirty || echo "JSR publish skipped/failed"
